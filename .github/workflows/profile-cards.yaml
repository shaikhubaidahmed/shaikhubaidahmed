name: Profile cards

on:
  schedule:
    - cron: "23 1 * * *" # daily, 06:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_cards.py
      - scripts/github.graphql
      - fonts/**
      - assets/**
      - .github/workflows/profile-cards.yaml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          mkdir -p data assets
          gh api graphql -F query=@scripts/github.graphql -f login="${{ github.repository_owner }}" > data/github.json
          jq -e '.data.user.contributionsCollection' data/github.json > /dev/null
          if [ ! -f assets/portrait.png ] && [ ! -f assets/portrait.jpg ]; then
            avatar=$(jq -r '.data.user.avatarUrl' data/github.json)
            curl -fsSL "${avatar}&s=288" -o assets/portrait.png || rm -f assets/portrait.png
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data assets README.md
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
